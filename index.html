<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wanderly Journey & Blueprint Explorer</title>
<style>
:root{
  --ink:#1C1C1E; --ink-soft:#5B5B60; --ink-faint:#9494A0;
  --bg:#FAFAF9; --panel:#FFFFFF; --line:#EAEAE7;
  --accent:#D6217E; --accent-soft:#FBE7F1;
  --motor:#2563A8; --motor-bg:#E7F0FA;
  --home:#2F7A52; --home-bg:#E7F5EC;
  --both:#6E4FA0; --both-bg:#F0EAF7;
  --pain:#D9432E; --pain-bg:#FCEAE6;
  --delight:#1B9E6B; --delight-bg:#E4F7EE;
  --obs:#E08A2C; --obs-bg:#FDF1E2;
  --hmw:#6E4FE0; --hmw-bg:#EFEAFC;
  --solution:#7C3AED; --solution-bg:#F8F4FE; --solution-border:#C9A8F5;
  --idea:#B8860B; --idea-bg:#FFF8E1; --idea-border:#EAD28A;
  --priority-high:#7C3AED; --priority-high-bg:#F2ECFE;
  --priority-med:#1B9E6B; --priority-med-bg:#E4F7EE;
  --priority-low:#B7791F; --priority-low-bg:#FDF1DF;
  --gap:#D9432E; --gap-bg:#FCEAE6;
  --hold:#E0972C; --hold-bg:#FDF1E2;
  --road:#6E4FE0; --road-bg:#EFEAFC;
  --delivery:#1B9E6B; --delivery-bg:#E4F7EE;
  --mono:'IBM Plex Mono','SF Mono',ui-monospace,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}

.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:100}
.topbar-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:14.5px;letter-spacing:-0.01em;white-space:nowrap}
.brand span{color:var(--accent)}
.search-wrap{position:relative;flex:1;min-width:220px;max-width:400px}
.search-wrap input{width:100%;padding:8px 14px 8px 42px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;font-family:var(--sans);background:var(--bg);outline:none}
.search-wrap input:focus{border-color:var(--accent);background:var(--panel)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:26px;line-height:1;pointer-events:none}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.1);max-height:340px;overflow-y:auto;z-index:200;display:none}
.search-results.open{display:block}
.search-result-item{padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.search-result-item:last-child{border-bottom:none}
.search-result-item:hover{background:var(--bg)}
.sr-kind{font-size:8.5px;font-weight:700;text-transform:uppercase;padding:2px 5px;border-radius:4px;flex-shrink:0}
.sr-ref{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--ink);color:#fff;padding:1px 6px;border-radius:5px;flex-shrink:0}
.sr-title{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter-group{display:flex;gap:3px;background:var(--bg);border-radius:8px;padding:3px}
.filter-btn{font-size:11.5px;padding:6px 10px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--ink-soft);cursor:pointer;font-family:var(--sans);white-space:nowrap}
.filter-btn.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.12)}
.fdropdown{position:relative;display:inline-block}
.filter-row-wrap{margin-top:8px}
.mobile-filter-btn{display:none}
.mobile-filter-panel-header{display:none}
.mobile-filter-overlay{display:none}
.mobile-lane-toggle-btn{display:none}
.lane-icon{display:none}
.pr-label-short{display:none}
.persona-chip-name{}
.stage-metric-chip{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px;cursor:pointer;display:flex;flex-direction:column;gap:1px;transition:box-shadow .12s,border-color .12s}
.stage-metric-chip:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);border-color:#D8D7D2}
.stage-metric-label{font-size:9px;color:var(--ink-faint);white-space:normal;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.stage-metric-value{font-size:12.5px;font-weight:700;color:var(--ink)}
.fdropdown-trigger{font-size:12px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-family:var(--sans);display:flex;align-items:center;gap:6px;white-space:nowrap}
.fdropdown-trigger.changed{color:#0F7A4F;border-color:#1B9E6B;font-weight:700;background:#E3F7EC}
.fdropdown-trigger .chev{display:inline-block;width:0;height:0;margin-left:4px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:5px solid var(--ink-faint);flex-shrink:0}
.fdropdown-panel{position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;min-width:190px;z-index:60;display:none}
.fdropdown-panel.open{display:block}
.fdropdown-option{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--ink)}
.fdropdown-option:hover{background:var(--bg)}
.fdropdown-option.divider{border-bottom:1px solid var(--line);margin-bottom:4px;padding-bottom:9px}
.fdropdown-option input[type=checkbox]{width:14px;height:14px;accent-color:#1B9E6B;flex-shrink:0}
.fdropdown-option.checked{background:#E3F7EC}
.fdropdown-option.checked span{color:#0F7A4F;font-weight:700}
.idea-checkbox{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);cursor:pointer;padding:0 4px}
.clear-filters-btn{background:none;border:none;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;padding:0 4px;text-decoration:underline}
.clear-filters-btn:hover{color:#0A5A38}

.idea-checkbox input{width:14px;height:14px;accent-color:#1B9E6B;cursor:pointer}
.view-toggle{display:flex;gap:3px;background:var(--bg);border-radius:8px;padding:3px;margin-left:auto}
.view-toggle .filter-btn{font-size:13px;font-weight:700;padding:8px 14px;border:1.5px solid transparent;color:var(--ink-soft)}
.view-toggle .filter-btn.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:none}
.subrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11.5px;color:var(--ink-faint)}
.legend{display:flex;gap:12px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-dot{width:8px;height:8px;border-radius:50%}

.journey-scroll{overflow-x:auto;padding:0 0 60px}
.journey-grid{display:grid;grid-template-columns:200px repeat(9,340px);min-width:max-content}
.stage-group-hd{padding:11px 16px;margin:6px 5px 0;border-radius:10px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-align:center}
.lane-label{position:sticky;left:0;background:var(--bg);z-index:20;padding:15px 12px;border-right:2px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:flex-start}
.lane-label-inner{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.stage-hd{padding:14px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.metric-card{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;min-width:190px;transition:box-shadow .12s,border-color .12s}
#globalMetricsBar{display:flex;flex-wrap:nowrap;gap:12px;padding:14px 20px 4px;overflow-x:auto;width:100%}
#globalMetricsBar .metric-card{flex:0 0 auto}
.theme-lozenge{display:inline-block;align-self:flex-start;width:fit-content;font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:20px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.02em}
.metric-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.09);border-color:#D8D7D2}
.metric-label{font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap;margin-bottom:6px}
.metric-body{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.metric-value{font-size:28px;font-weight:800;color:var(--ink);line-height:1.1}
.metric-trend{font-size:12px;font-weight:600;margin-top:5px;white-space:nowrap}
.metric-spark{width:96px;height:48px;flex-shrink:0}
.stage-name{font-size:13px;font-weight:700}
.stage-sub{font-size:10.5px;color:var(--ink-faint);margin-top:1px}
.lane-cell{padding:10px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-height:44px}
.lane-cell.emotion-cell{align-items:flex-start;justify-content:center}
.emo-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
.emotion-row{border-bottom:1px solid var(--line);background:var(--panel);padding:6px 0 2px}
.emotion-caption{font-size:10px;color:var(--ink-faint);text-align:right;padding:0 16px 4px;font-style:italic}
.emo-word{font-size:10.5px;font-weight:700;text-align:center}

.mini-card{background:var(--panel);border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;font-size:13.5px;line-height:1.45;transition:box-shadow .12s, border-color .12s;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.mini-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.09);border-color:#D8D7D2}
.mini-card.hidden{display:none}
.mini-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.metric-card.selected,.stage-metric-chip.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
body.has-selection .mini-card:not(.selected){opacity:.32;filter:saturate(.5)}
body.has-selection .bubble:not(.selected){opacity:.14!important;filter:saturate(.3)}
body.has-selection .bubble.selected .bubble-ring{stroke-width:3.5}
.bubble.on-board{opacity:.55}
.card-icon{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;font-weight:700}
.card-icon.pain{background:var(--pain);color:#fff}
.card-icon.delight{background:var(--delight);color:#fff}
.card-icon.observation{background:var(--obs);color:#fff}
.card-icon.hmw{background:var(--hmw-bg);color:var(--hmw)}
.card-icon.solution{background:var(--solution-bg);color:var(--solution)}
.card-icon.bp-frontstage{background:var(--frontstage);color:#fff}
.card-icon.bp-backstage{background:var(--backstage);color:#fff}
.card-icon.bp-support{background:var(--support);color:#fff}
.card-icon.bp-customer{background:var(--accent);color:#fff}
.card-icon.failpoint{background:var(--pain);color:#fff}
.card-icon.efficiency{background:var(--delight);color:#fff}
.mini-card.is-solution{background:var(--solution-bg);border-color:var(--solution-border)}
.mini-card.is-solution:hover{border-color:var(--solution)}
.mini-card.is-solution.on-board{background:var(--panel)}
.mini-card.is-idea{border-style:dashed;background:var(--idea-bg);border-color:var(--idea-border)}
.mini-card.is-idea:hover{border-color:var(--idea)}
.mini-card.is-idea .card-icon.solution{background:#fff;color:var(--idea)}
.mini-card.is-pain{background:var(--pain-bg);border-color:#EFB3A5}
.mini-card.is-pain:hover{border-color:var(--pain)}
.mini-card.is-delight{background:var(--delight-bg);border-color:#A6DDC4}
.mini-card.is-delight:hover{border-color:var(--delight)}
.mini-card.is-observation{background:var(--obs-bg);border-color:#F0CE9E}
.mini-card.is-observation:hover{border-color:var(--obs)}
.card-icon.gap-genuine{background:var(--gap-bg);color:var(--gap)}
.card-icon.gap-partial{background:var(--hold-bg);color:var(--hold)}
.card-icon.gap-well{background:var(--delivery-bg);color:var(--delivery)}
.mini-card-top{display:flex;align-items:flex-start;gap:8px}
.search-hint-row{display:flex;align-items:flex-start;gap:8px;background:#FFF9EC;border:1px dashed #E0C87A;border-radius:8px;padding:8px 10px;margin-bottom:6px}
.search-hint-row .sh-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#8A6D1D;flex-shrink:0;padding-top:1px}
.search-hint-row .sh-term{font-size:12px;color:#5A4610;font-family:var(--mono);word-break:break-word}
.gap-strip{padding:8px 20px 20px 152px;display:flex;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--bg)}
.gap-strip-label{width:100%;font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.gap-strip .mini-card{width:230px}
.mini-card-badges{display:flex;gap:4px;margin-bottom:5px;align-items:center;flex-wrap:wrap}
.tiny-pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.02em}
.open-pill{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--hmw-bg);color:var(--hmw);flex-shrink:0}
.onboard-check{position:absolute;top:11px;right:12px;width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;flex-shrink:0;z-index:2}
.onboard-check.on{background:var(--delivery);border-color:var(--delivery);color:#fff}
.mini-card.on-board{opacity:.62}
.mini-card.on-board:hover{opacity:.85}
.panel-onboard-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg);border-radius:9px;margin-bottom:14px}
.panel-onboard-row .label{font-size:12.5px;font-weight:600;color:var(--ink)}
.sticky-label-row{background:var(--ink);border-radius:9px;padding:10px 12px;margin:4px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sticky-label-row .lbl-text{font-family:var(--mono);font-size:11.5px;color:#fff;word-break:break-word;flex:1}
.copy-btn{font-size:10.5px;font-weight:600;background:rgba(255,255,255,.15);color:#fff;border:none;padding:5px 10px;border-radius:6px;cursor:pointer;flex-shrink:0}
.copy-btn:hover{background:rgba(255,255,255,.25)}
.mini-card-text{color:var(--ink);font-weight:500}
.analytics-dot{width:5px;height:5px;border-radius:50%;background:var(--pain);display:inline-block;margin-left:3px}

.matrix-wrap{padding:0;width:100%}
.matrix-controls{display:flex;gap:20px;margin-bottom:0;padding:14px 20px;flex-wrap:wrap;align-items:flex-end;border-bottom:1px solid var(--line)}
.mc-group{display:flex;flex-direction:column;gap:4px}
.mc-label{font-size:10.5px;font-weight:700;color:var(--ink-soft)}
.mc-select{font-size:12.5px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-weight:500;font-family:var(--sans);cursor:pointer}
.stat-pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--bg);color:var(--ink-soft);border:1px solid var(--line)}
.matrix-hover-card{position:absolute;z-index:50;width:260px;background:#fff;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:14px 16px;pointer-events:none}
.mhc-title{font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:6px;line-height:1.3}
.mhc-why{font-size:12px;color:var(--ink-soft);line-height:1.5;margin-bottom:10px}
.mhc-why span{font-weight:700;color:var(--ink-faint);font-size:10px;letter-spacing:.03em}
.mhc-stats{display:flex;gap:14px;border-top:1px solid var(--line);padding-top:10px}
.mhc-stats>div{display:flex;flex-direction:column;gap:2px}
.mhc-stat-label{font-size:9.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em}
.mhc-stat-val{font-size:13px;font-weight:700;color:var(--ink)}
.matrix-svg-container{background:var(--panel);width:100%;padding:20px 16px 8px}
.bubble{cursor:pointer;transition:opacity .15s}
.bubble.hidden{display:none}
.bubble-ring{fill:none;stroke:var(--accent);stroke-width:0;transition:stroke-width .15s}
.bubble.selected .bubble-ring{stroke-width:3}

.overlay{position:fixed;inset:0;background:rgba(20,20,22,.35);z-index:900;opacity:0;pointer-events:none;transition:opacity .18s}
.overlay.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:-660px;width:640px;max-width:92vw;height:100vh;background:var(--panel);z-index:901;box-shadow:-10px 0 40px rgba(0,0,0,.18);transition:right .22s cubic-bezier(.2,.8,.3,1);overflow-y:auto}
.panel.open{right:0}
.panel-head{padding:64px 24px 16px;position:sticky;top:0;background:var(--panel);z-index:5;border-bottom:1px solid var(--line)}
.panel-close{position:absolute;top:20px;right:20px;width:30px;height:30px;border-radius:50%;border:none;background:var(--bg);color:var(--ink-soft);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:6}
.panel-back{position:absolute;top:20px;left:24px;width:30px;height:30px;border-radius:50%;border:none;background:var(--bg);color:var(--ink-soft);font-size:16px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:6}
.panel-back:hover{background:var(--line)}
.panel-close:hover{background:var(--line)}
.panel-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding-right:40px}
.badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px}
.panel-title{font-size:19px;font-weight:700;line-height:1.4;padding-right:36px;letter-spacing:-0.01em}
.panel-sub{font-size:12.5px;color:var(--ink-soft);margin-top:5px}
.panel-scores{display:flex;gap:20px;margin-top:14px}
.score-box{display:flex;flex-direction:column;gap:2px}
.score-label{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:700}
.score-val{font-size:15px;font-weight:800}
.panel-tabs{display:flex;gap:0;margin-top:16px;border-bottom:1px solid var(--line)}
.ptab{font-size:12.5px;padding:9px 4px;margin-right:18px;border:none;background:transparent;color:var(--ink-faint);cursor:pointer;font-weight:500;font-family:var(--sans);border-bottom:2px solid transparent}
.ptab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.prop-list{border-top:1px solid var(--line);margin-top:14px;padding-top:2px}
.prop-row{display:grid;grid-template-columns:150px 1fr;align-items:center;column-gap:20px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.prop-row:last-child{border-bottom:none}
.prop-row-label{color:var(--ink-soft);font-weight:500}
.prop-row-val{font-weight:600;color:var(--ink);text-align:left}
.mc-sub-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink-faint);cursor:pointer}
.mc-sub-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.matrix-list-table{width:100%;border-collapse:collapse;font-size:12.5px}
.matrix-list-table th{text-align:left;font-size:11px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line)}
.matrix-list-table td{padding:11px 10px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:middle}
.matrix-list-table tr{cursor:pointer}
.matrix-list-table tr:hover td{background:var(--bg)}
.link-item-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:7px;cursor:pointer;transition:box-shadow .12s}
.entry-row{display:flex;align-items:flex-start;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:7px}
.link-item-row:hover{box-shadow:0 3px 10px rgba(0,0,0,.07)}
.link-item-text{flex:1;font-size:12.5px;color:var(--ink);font-weight:500}
.link-item-pill{font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:20px;flex-shrink:0}
.panel-body{padding:18px 24px 60px}
.pcontent{display:none}
.pcontent.on{display:block}
.plabel{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);font-weight:800;margin:18px 0 8px}

<script>
// ---- DATABASE WIRING ----
// Fill these in from your Supabase project (Settings -> API) before deploying.
const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
let sb = null;
if(typeof supabase !== 'undefined'){
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} else {
  console.error("Supabase library didn't load — check your internet connection or an ad-blocker isn't blocking the CDN script. Login and saving won't work until this loads, but the rest of the page will still function.");
}

async function doSignIn(){
  if(!sb){ document.getElementById('authError').textContent = "Can't connect right now — the database library didn't load. Try refreshing."; return; }
  const email = document.getElementById('authEmail').value;
  const password = document.getElementById('authPassword').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ document.getElementById('authError').textContent = error.message; return; }
  onLoggedIn();
}
async function doSignUp(){
  if(!sb){ document.getElementById('authError').textContent = "Can't connect right now — the database library didn't load. Try refreshing."; return; }
  const email = document.getElementById('authEmail').value;
  const password = document.getElementById('authPassword').value;
  const { error } = await sb.auth.signUp({ email, password });
  if(error){ document.getElementById('authError').textContent = error.message; return; }
  document.getElementById('authError').textContent = "Account created — check your email to confirm, then log in.";
}
async function onLoggedIn(){
  document.getElementById('loginGate').style.display = 'none';
  document.getElementById('appShell').style.display = 'block';
  await loadPersonasFromDb();
  await loadSolutionsFromDb();
  render();
}
async function loadPersonasFromDb(){
  if(!sb) return;
  const { data, error } = await sb.from('personas').select('*');
  if(error){ console.error('Could not load personas:', error.message); return; }
  if(data && data.length){
    PERSONAS.length = 0;
    data.forEach(row=>PERSONAS.push({
      id: row.id, name: row.name, product: "Wanderly", color: row.color || "#7C3AED", bg: (row.color||"#7C3AED")+"22",
      img: row.image_url || null, aboutMe: row.about_me || [], needs: row.needs || [], painPoints: row.pain_points || [],
      goals: row.goals || [], scenario: row.scenario || "", quote: row.quote || "",
      journeyName: "Wanderly booking journey", journeyProduct: "Wanderly"
    }));
  }
}
async function loadSolutionsFromDb(){
  if(!sb) return;
  const { data, error } = await sb.from('solutions').select('*');
  if(error){ console.error('Could not load solutions:', error.message); return; }
  if(data && data.length){
    data.forEach(row=>{
      const s = SOLUTIONS.find(x=>x.ref===row.ref);
      if(s){ s.title=row.title; s.effort=row.effort; s.mv=row.member_value; s.bv=row.business_value; s.road=row.road_status; s.dbId=row.id; }
    });
  }
}
async function savePersonaToDb(id, fields){
  if(!sb) return { message: "Not connected to the database." };
  const { error } = await sb.from('personas').update(fields).eq('id', id);
  return error;
}
async function saveSolutionToDb(ref, fields){
  if(!sb) return "Not connected to the database.";
  const s = SOLUTIONS.find(x=>x.ref===ref);
  if(!s || !s.dbId) return "No database record for this solution yet.";
  const { error } = await sb.from('solutions').update(fields).eq('id', s.dbId);
  return error ? error.message : null;
}
(async function initAuth(){
  if(!sb) return;
  const { data } = await sb.auth.getSession();
  if(data.session) onLoggedIn();
})();

function renderSeriesRow(series){
  const h = series.history;
  const single = h.length===1;
  let svg;
  if(single){
    svg = `<svg viewBox="0 0 160 44" style="width:100%;height:38px">
      <line x1="10" y1="30" x2="150" y2="30" stroke="#EEEDE9" stroke-width="1"/>
      <circle cx="80" cy="30" r="5" fill="#7B61FF"/>
      <text x="80" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${esc(String(h[0].num))}%</text>
    </svg>`;
  } else {
    const nums = h.map(p=>p.num);
    const min = Math.min(...nums), max = Math.max(...nums);
    const range = (max-min) || 1;
    const padY = 14, plotH = 38-padY;
    const stepX = 130/(h.length-1);
    const pts = h.map((p,idx)=>({x:10+idx*stepX, y: 4+(1-(p.num-min)/range)*plotH}));
    const pathD = pts.map((p,i)=>(i===0?'M':'L')+p.x+','+p.y).join(' ');
    svg = `<svg viewBox="0 0 160 44" style="width:100%;height:38px">
      <path d="${pathD}" fill="none" stroke="#7B61FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#7B61FF"/><text x="${p.x}" y="${p.y-8}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)">${esc(String(h[i].num))}%</text>`).join('')}
    </svg>`;
  }
  return `<div style="display:flex;align-items:center;gap:10px;padding:6px 0">
    <div style="width:100px;flex-shrink:0;font-size:11.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap">${esc(series.label)}</div>
    <div style="flex:1">${svg}</div>
  </div>`;
}
function renderMetricGroups(groups){
  return groups.map(g=>`<div style="border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:12px;background:#fff">
    ${g.title?`<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);margin-bottom:2px">${esc(g.title)}</div>`:''}
    ${g.series.map(renderSeriesRow).join('<div style="border-top:1px solid var(--line)"></div>')}
  </div>`).join('');
}

function esc(s){return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function prodMatch(itemProduct){
  if(state.product.size===0) return true;
  if(state.product.has("Home") || state.product.has("Motor") || state.product.has("Both")){
    let match=false;
    if(state.product.has("Home") && (itemProduct==="Home" || itemProduct==="Both")) match=true;
    if(state.product.has("Motor") && (itemProduct==="Motor" || itemProduct==="Both")) match=true;
    if(state.product.has("Both") && itemProduct==="Both") match=true;
    return match;
  }
  return state.product.has(itemProduct);
}
function roadMatch(road){ return state.road.size===0 || state.road.has(road); }
function effortMatch(effort){ return state.effort.size===0 || state.effort.has(String(effort)); }
function priorityMatch(s){ return state.priority.size===0 || state.priority.has(computePriority(s).label); }
function insightVisible(i){ return prodMatch(i.product); }
function oppVisible(o){
  if(!prodMatch(o.product)) return false;
  if(state.road.size>0){
    if(!o.solution) return false;
    const s=solutionByRef[o.solution];
    if(!s || !roadMatch(s.road)) return false;
  }
  return true;
}

function solutionVisible(s){ return prodMatch(s.product) && roadMatch(s.road) && effortMatch(s.effort) && priorityMatch(s) && (state.showIdeas || !s.isIdea); }
function computePriority(s){
  const avg=(s.mv+s.bv)/2;
  const score = avg - s.effort;
  if(score>=1.0) return {label:"High", color:"var(--priority-high)", bg:"var(--priority-high-bg)"};
  if(score>=0) return {label:"Moderate", color:"var(--priority-med)", bg:"var(--priority-med-bg)"};
  return {label:"Low", color:"var(--priority-low)", bg:"var(--priority-low-bg)"};
}

function sentimentColor(v){
  // -2 (red) -> 0 (amber) -> +2 (green)
  if(v>=0){ const t=Math.min(v/2,1); return lerpColor("#B7791F","#1B8464",t); }
  const t=Math.min(-v/2,1); return lerpColor("#B7791F","#C0392B",t);
}
function lerpColor(a,b,t){
  const ah=a.replace('#',''), bh=b.replace('#','');
  const ar=parseInt(ah.slice(0,2),16), ag=parseInt(ah.slice(2,4),16), ab=parseInt(ah.slice(4,6),16);
  const br=parseInt(bh.slice(0,2),16), bg=parseInt(bh.slice(2,4),16), bb=parseInt(bh.slice(4,6),16);
  const r=Math.round(ar+(br-ar)*t), g=Math.round(ag+(bg-ag)*t), bl=Math.round(ab+(bb-ab)*t);
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${bl.toString(16).padStart(2,'0')}`;
}

function renderEmotionLine(){
  const n=STAGES.length;
  const colW=isMobile()?200:340, W=colW*n, H=150;
  const pad=32;
  const plotH=H-pad*2;
  function xAt(i){ return (i+0.5)*colW; }
  function yAt(v){ return pad + (1-(v+2)/4)*plotH; } // v in [-2,2]
  let path=`M ${xAt(0)} ${yAt(STAGES[0].sentiment)}`;
  for(let i=1;i<n;i++){
    const x0=xAt(i-1), y0=yAt(STAGES[i-1].sentiment);
    const x1=xAt(i), y1=yAt(STAGES[i].sentiment);
    const dx=(x1-x0)/2;
    path+=` C ${x0+dx} ${y0}, ${x1-dx} ${y1}, ${x1} ${y1}`;
  }
  let gradStops='';
  STAGES.forEach((st,i)=>{ gradStops+=`<stop offset="${(i/(n-1)*100).toFixed(1)}%" stop-color="${sentimentColor(st.sentiment)}"/>`; });
  let dots='', words='';
  STAGES.forEach((st,i)=>{
    const cx=xAt(i), cy=yAt(st.sentiment), c=sentimentColor(st.sentiment);
    dots+=`<circle cx="${cx}" cy="${cy}" r="6" fill="${c}"/><circle cx="${cx}" cy="${cy}" r="12" fill="${c}" opacity="0.15"/>`;
  });
  const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">
    <defs><linearGradient id="sentGrad" x1="0" y1="0" x2="1" y2="0">${gradStops}</linearGradient></defs>
    <line x1="0" y1="${yAt(0)}" x2="${W}" y2="${yAt(0)}" stroke="#E4E3E0" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="${path}" fill="none" stroke="url(#sentGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
  const wordsRow = STAGES.map(st=>`<div style="width:${colW}px;flex-shrink:0"><div class="emo-word" style="color:${sentimentColor(st.sentiment)}">${st.emo}</div></div>`).join('');
  return `<div class="emotion-row" style="grid-column:span ${STAGES.length}">
    ${svg}
    <div style="display:flex">${wordsRow}</div>
    <div class="emotion-caption">Illustrative direction from the qualitative pain/delight balance at each stage — not a measured score</div>
  </div>`;
}

const AXIS_LABEL={avg:"Value (member + business avg)",mv:"Member value",bv:"Business value",effort:"Effort"};
function axisValue(it, axis){
  if(axis==='avg') return (it.mv+it.bv)/2;
  if(axis==='mv') return it.mv;
  if(axis==='bv') return it.bv;
  if(axis==='effort') return it.effort;
  return 0;
}

function renderMatrix(){
  const svg=document.getElementById('matrixSvg');
  const xAxis = document.getElementById('xAxisSelect')?.value || 'effort';
  const yAxis = document.getElementById('yAxisSelect')?.value || 'avg';
  const sizeAxis = document.getElementById('sizeAxisSelect')?.value || 'avg';
  const rect = svg.getBoundingClientRect();
  const W = Math.max(rect.width, 800);
  const H = Math.max(rect.height, 500);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const pad=70;
  const plotW=W-pad-50, plotH=H-pad-90;
  const SCALE_MAX=6; // headroom above the real 0-5 data range so top bubbles aren't clipped
  function px(v){return pad + (v/SCALE_MAX)*plotW;}
  function py(v){return (H-pad-30) - (v/SCALE_MAX)*plotH;}
  let s=`<line x1="${pad}" y1="${H-pad-30}" x2="${W-30}" y2="${H-pad-30}" stroke="#D2D1CC" stroke-width="1.5"/>`;
  s+=`<line x1="${pad}" y1="${H-pad-30}" x2="${pad}" y2="60" stroke="#D2D1CC" stroke-width="1.5"/>`;
  for(let v=0;v<=5;v++){
    s+=`<text x="${pad-14}" y="${py(v)+4}" text-anchor="end" font-size="12" fill="#9494A0" font-family="-apple-system,'Segoe UI',Arial,sans-serif">${v}</text>`;
    s+=`<line x1="${pad}" y1="${py(v)}" x2="${W-30}" y2="${py(v)}" stroke="#EEEDE9" stroke-width="1"/>`;
  }
  for(let e=0;e<=5;e++){ s+=`<text x="${px(e)}" y="${H-pad+2}" text-anchor="middle" font-size="12" fill="#9494A0" font-family="-apple-system,'Segoe UI',Arial,sans-serif">${e}</text>`; }
  s+=`<text x="22" y="${H/2}" text-anchor="middle" font-size="13" font-weight="700" fill="#5B5B60" font-family="-apple-system,'Segoe UI',Arial,sans-serif" transform="rotate(-90 22 ${H/2})">${AXIS_LABEL[yAxis]} →</text>`;
  s+=`<text x="${W/2}" y="${H-14}" text-anchor="middle" font-size="13" font-weight="700" fill="#5B5B60" font-family="-apple-system,'Segoe UI',Arial,sans-serif">${AXIS_LABEL[xAxis]} →</text>`;

  const shown = SOLUTIONS.filter(it=> prodMatch(it.product) && roadMatch(it.road) && effortMatch(it.effort) && priorityMatch(it) && (state.showIdeas || !it.isIdea));
  const withPos = shown.map(it=>({it, xv:axisValue(it,xAxis), yv:axisValue(it,yAxis), sv: sizeAxis==='none'?2.5:axisValue(it,sizeAxis)}));
  withPos.sort((a,b)=>b.sv-a.sv); // biggest drawn first, smaller ones drawn after so they sit on top when nested inside a bigger circle

  // Group items sharing the exact same coordinate — with only ~9 possible values per axis (1-5 in 0.5 steps),
  // dozens of the 44 items land on identical pixels. Fan those out in a small ring around the true point
  // so every one of them stays visible and independently hoverable, rather than only the last-drawn surviving.
  const groups = {};
  withPos.forEach(item=>{
    const key = item.xv+'|'+item.yv;
    (groups[key] = groups[key]||[]).push(item);
  });
  Object.values(groups).forEach(group=>{
    const n = group.length;
    if(n===1){ group[0].fanAngle=0; group[0].fanRadius=0; return; }
    group.forEach((item,i)=>{
      item.fanAngle = (2*Math.PI*i)/n;
      item.fanRadius = 15 + n*3; // wider fan for bigger clusters so items don't touch
    });
  });

  withPos.forEach(({it,xv,yv,sv,fanAngle,fanRadius})=>{
    const baseX=px(xv), baseY=py(yv);
    const cx = baseX + Math.cos(fanAngle)*fanRadius;
    const cy = baseY + Math.sin(fanAngle)*fanRadius;
    const r = 8 + Math.pow(Math.max(sv,0)/5, 2.5) * 30; // steeper curve — makes 3 vs 3.5 vs 4 vs 5 clearly distinct, bigger max for easier clicking
    const color = it.product==="Motor"?"#2563A8":it.product==="Home"?"#2F7A52":"#6E4FA0";
    const isSel = selectedKey==='solution-'+it.ref;
    s+=`<g class="bubble${isSel?' selected':''}" data-key="sol-${it.ref}" onclick="openPanel('solution','${it.ref}')" onmouseenter="showMatrixHover(event,'${it.ref}')" onmouseleave="hideMatrixHover()">
      ${fanRadius>0?`<line x1="${baseX}" y1="${baseY}" x2="${cx}" y2="${cy}" stroke="#E4E3E0" stroke-width="1"/>`:''}
      <circle class="bubble-ring" cx="${cx}" cy="${cy}" r="${r+4}"/>
      <circle class="bubble-main" cx="${cx}" cy="${cy}" r="${r}" fill="${isSel?color+'55':color+'33'}" stroke="${color}" stroke-width="${isSel?3:1.5}"/>
      <foreignObject x="${cx-42}" y="${cy+r+2}" width="84" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:-apple-system,'Segoe UI',Arial,sans-serif;font-size:9px;color:#5B5B60;line-height:1.2;text-align:center;overflow:hidden">${esc(it.title.slice(0,28))}${it.title.length>28?'…':''}</div></foreignObject>
    </g>`;
  });

function stickyLabel(s){

async function copyStickyLabel(ref){
  const s=solutionByRef[ref]; if(!s) return;
  const text = stickyLabel(s);
  const labelEl = document.querySelector(`#stickyLabel-${ref.replace('·','-')}`);
  const btn = labelEl?.nextElementSibling;
  let ok=false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      ok=true;
    }
  }catch(e){ ok=false; }
  if(!ok){
    try{
      const ta=document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.focus(); ta.select();
      ok=document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e){ ok=false; }
  }
  if(!btn) return;
  const orig=btn.textContent;
  if(ok){
    btn.textContent='Copied'; setTimeout(()=>btn.textContent=orig,1200);
  } else {
    // Last resort: select the visible text so the person can Ctrl/Cmd+C manually
    if(labelEl){
      const range=document.createRange(); range.selectNodeContents(labelEl);
      const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    }
    btn.textContent='Select & press ⌘/Ctrl+C'; setTimeout(()=>btn.textContent=orig,2200);
  }
}

function chipsForInsight(i){

  if(!opps.length) return '<span class="empty-note">Not yet linked to an opportunity.</span>';
  return opps.map(o=>{
    if(o.text.startsWith('No standalone')) return `<div class="empty-note" style="font-style:italic">No standalone HMW for this one — ${esc(o.text.replace(/^No standalone HMW\s*—\s*/,''))}</div>`;

function solutionsForInsight(i){

  const refs=[...new Set(opps.map(o=>o.solution))];

}

function insightsForSolution(s){
  const oppIds=s.opps||[];

  if(!ids.size) return '<span class="empty-note">No linked insights recorded.</span>';
  return [...ids].map(iid=>{
    const i=insightById[iid]; if(!i) return '';
    const c={pain:['var(--pain-bg)','var(--pain)'],delight:['var(--delight-bg)','var(--delight)'],observation:['var(--obs-bg)','var(--obs)']}[i.type];
    return `<div class="link-item-row" onclick="openPanelNav('insight','${i.id}')"><span class="card-icon ${i.type}" style="width:18px;height:18px;font-size:10px">${TYPE_ICON[i.type]}</span><span class="link-item-text">${esc(i.text.slice(0,60))}${i.text.length>60?'…':''}</span><span class="link-item-pill" style="background:${c[0]};color:${c[1]}">${i.type}</span></div>`;

  const opps=OPPS.filter(o=>o.insights.includes(i.id) && o.solution);

      ${s.research?`<div class="link-row"><span class="link-kind res">Research</span><span class="link-text"><a href="${s.research.url}" target="_blank" rel="noreferrer">${esc(s.research.title)}${s.research.date?', '+esc(s.research.date):''} ↗</a></span></div>${researchSearchHint(s)}`:`<div class="link-row"><span class="link-kind res">Research</span><span class="link-text" style="color:var(--ink-faint)">No research document found beyond the journey map itself for this item.</span></div>`}
      <p class="plabel">Related pain points / delights</p><div class="connect-section">${insightsForSolution(s)}</div>
      ${s.ideaSource?`<p class="plabel">Where this idea came from</p><div class="flag-box" style="background:var(--idea-bg);border-left-color:var(--idea)"><p style="color:#7A5A0A">💡 ${esc(s.ideaSource)}</p></div>${s.ideaLink?`<div class="link-row"><span class="link-kind res">Source</span><span class="link-text"><a href="${s.ideaLink.url}" target="_blank" rel="noreferrer">${esc(s.ideaLink.title)} ↗</a></span></div>`:''}`:''}
      ${s.assumption?`<p class="plabel">My working assumption — not confirmed by research</p><div class="flag-box" style="background:#FFF9EC;border-left-color:#E0972C"><p style="color:#7A5A12;font-style:italic">${esc(s.assumption)}</p></div>`:''}
      ${s.flags.length?`<p class="plabel">Worth knowing</p>${s.flags.map(f=>`<div class="flag-box"><p>${esc(f)}</p></div>`).join('')}`:''}`;
    document.getElementById('tab-metrics').innerHTML=solLinkedSubs.length?`<div class="connect-section">${solLinkedSubs.map(sm=>`<div class="link-item-row" onclick="openPanelNav('submetric','${sm.id}')"><span class="link-item-text">${esc(sm.label)}</span><span class="link-item-pill" style="background:var(--bg);color:var(--ink-soft)">${esc(sm.value)}</span></div>`).join('')}</div>`:'<span class="empty-note">Not tied to a metrics card yet.</span>';
    document.getElementById('tab-opps').innerHTML=`<p class="plabel">Related opportunity (HMW)</p><div class="connect-section">${chipsForSolutionOpps(s)}</div>`;
    document.getElementById('tab-roadmap').innerHTML=`<div class="status-box"><p>${esc(s.roadmapNote||'No roadmap note recorded.')}</p></div><p style="font-size:11px;color:var(--ink-faint);margin-top:10px">Added to squad Miro board: ${s.onBoard?'Yes':'Not yet'}</p>`;
    switchTab('overview');
  } else if(kind==='gap'){
    const g=GAPS.find(x=>x.id===id); if(!g) return;
    const vBg=g.verdict==='genuine'?'var(--gap-bg)':g.verdict==='partial'?'var(--hold-bg)':'var(--delivery-bg)';
    const vC=g.verdict==='genuine'?'var(--gap)':g.verdict==='partial'?'var(--hold)':'var(--delivery)';
    document.getElementById('panelBadges').innerHTML=`<span class="badge" style="background:${vBg};color:${vC}">${VERDICT_LABEL[g.verdict]}</span><span class="badge" style="background:${PROD_BG[g.product]};color:${PROD_COLOR[g.product]}">${g.product}</span>`;
    document.getElementById('panelTitle').textContent = g.gapTitle;
    document.getElementById('panelSub').textContent = g.figure;
    document.getElementById('panelScores').innerHTML='';
    const relatedMetrics = allSubMetrics().filter(sm=>sm.relatedGap===g.id);
    const relatedSol = g.solution ? solutionByRef[g.solution] : null;
    const relatedPainCount = relatedSol ? insightIdsForSolution(relatedSol).length : 0;
    allTabs[2].textContent=`Insights (${relatedPainCount})`; allTabs[2].style.display='inline';
    allTabs[4].textContent=`Solutions (${g.solution?1:0})`; allTabs[4].style.display='inline';
    allTabs[5].textContent=`Metrics (${relatedMetrics.length})`; allTabs[5].style.display='inline';
    document.getElementById('tab-overview').innerHTML=`
      <p class="plabel">What the journey map says at this stage</p><p class="pbody-text">${esc(g.mapSays)}</p>
      ${g.discoveryNote?`<div class="flag-box" style="background:var(--hmw-bg);border-left-color:var(--hmw);margin-top:16px"><p style="color:var(--hmw)">${esc(g.discoveryNote).replace(/^Discovery opportunity:/,'<strong>Discovery opportunity:</strong>')}</p></div>`:''}`;
    document.getElementById('tab-insights').innerHTML=`
      <div class="search-hint-row"><span class="sh-label">Search ${esc(g.docName)} for</span><span class="sh-term">"${esc(g.docSearch)}"</span></div>
      ${g.jmSearch?`<div class="search-hint-row"><span class="sh-label">Search the journey map for</span><span class="sh-term">"${esc(g.jmSearch)}"</span></div>`:''}
      <p class="plabel">Where this figure comes from</p><p class="pbody-text">${esc(g.docName)} — this is not a journey map document; check it directly for the exact figure and context.</p>
      <p class="plabel">Related pain points</p><div class="connect-section">${relatedSol?insightsForSolution(relatedSol):'<span class="empty-note">No linked solution to trace pain points from — this gap rests on the figure alone.</span>'}</div>`;
    document.getElementById('tab-metrics').innerHTML=`
      ${relatedMetrics.length?relatedMetrics.map(sm=>`<div class="link-item-row" onclick="openPanelNav('submetric','${sm.id}')"><span class="link-item-text">${esc(sm.label)}</span><span class="link-item-pill" style="background:var(--bg);color:var(--ink-soft)">${esc(sm.value)}</span></div>`).join(''):'<span class="empty-note">Not tied to a metrics card yet.</span>'}`;
    document.getElementById('tab-solutions').innerHTML=`<div class="connect-section">${chipForSolution(g.solution)}</div>`;
    switchTab('overview');
  }
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}
async function saveEditedSolution(ref){
  const title = document.getElementById('edit-sol-title').value;
  const effort = parseInt(document.getElementById('edit-sol-effort').value);
  const mv = parseInt(document.getElementById('edit-sol-mv').value);
  const bv = parseInt(document.getElementById('edit-sol-bv').value);
  const road = document.getElementById('edit-sol-road').value;
  const status = document.getElementById('sol-save-status');
  status.textContent = 'Saving...';
  const errMsg = await saveSolutionToDb(ref, {title, effort, member_value: mv, business_value: bv, road_status: road});
  if(errMsg){ status.textContent = 'Error: '+errMsg; return; }
  const s = solutionByRef[ref];
  s.title=title; s.effort=effort; s.mv=mv; s.bv=bv; s.road=road;
  status.textContent = 'Saved';
  render();
  openPanel('solution', ref);
}
async function saveEditedPersona(id){
  const name = document.getElementById('edit-persona-name').value;
  const quote = document.getElementById('edit-persona-quote').value;
  const status = document.getElementById('persona-save-status');
  status.textContent = 'Saving...';
  const error = await savePersonaToDb(id, {name, quote});
  if(error){ status.textContent = 'Error: '+error.message; return; }
  const p = PERSONAS.find(x=>x.id===id);
  p.name = name; p.quote = quote;
  status.textContent = 'Saved';
  render();
}
function closePanel(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
  panelHistory=[]; currentPanelKind=null; currentPanelId=null;
  document.body.classList.remove('has-selection');
  clearSelection(); selectedKey=null;
}
function switchTab(t){
  document.querySelectorAll('.ptab').forEach(b=>b.classList.toggle('on', b.dataset.tab===t));
  document.querySelectorAll('.pcontent').forEach(c=>c.classList.toggle('on', c.id==='tab-'+t));
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closePanel();
  if(e.key==='/' && document.activeElement.id!=='searchInput'){ e.preventDefault(); document.getElementById('searchInput').focus(); }
});

render();
window.addEventListener('load', ()=>{ render(); });
let resizeTimer=null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{ render(); }, 150);
});
document.addEventListener('mouseover', e=>{
  const clickable = e.target.closest('.mini-card,.link-item-row,.bubble,.fdropdown-trigger,.fdropdown-option,.filter-btn,button,[onclick]');
  if(clickable){
    clickable.style.setProperty('cursor','pointer','important');
    clickable.querySelectorAll('*').forEach(el=>el.style.setProperty('cursor','pointer','important'));
  }
});
</script>
</div>
</body>
</html>
