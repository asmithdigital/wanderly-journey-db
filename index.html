<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wanderly Journey & Blueprint Explorer</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand">Wanderly <span>Journey & Blueprint Explorer</span></div>
    <span style="font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:#FDF1DF;color:#B7791F;padding:3px 9px;border-radius:20px;white-space:nowrap">⚠ Demo data — fictional travel booking product</span>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="searchInput" type="text" placeholder="Search W1, a pain point, an HMW..." autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
    <div class="view-toggle" id="viewToggle">
      <button class="filter-btn on" data-view="journey">Journey map</button>
      <button class="filter-btn" data-view="matrix">Opportunities</button>
      <button class="filter-btn" data-view="persona">Personas</button>
    </div>
    <button id="mobileFilterBtn" class="mobile-filter-btn" onclick="toggleMobileFilters()">Filters</button>
  </div>
  <div class="topbar-row filter-row-wrap" id="filterRowWrap">
    <div class="mobile-filter-panel-header">
      <span>Filters</span>
      <button onclick="toggleMobileFilters()" aria-label="Close filters">✕</button>
    </div>
    <div class="fdropdown" id="fd-product" data-key="product"></div>
    <div class="fdropdown" id="fd-effort" data-key="effort"></div>
    <div class="fdropdown" id="fd-road" data-key="road"></div>
    <div class="fdropdown" id="fd-priority" data-key="priority"></div>
    <button id="clearFiltersBtn" class="clear-filters-btn" onclick="clearAllDropdownFilters()" style="display:none">Clear all</button>
    <label class="idea-checkbox">
      <input type="checkbox" id="ideaCheckbox">
      <span>Show ideas</span>
    </label>
  </div>
  <div class="mobile-filter-overlay" id="mobileFilterOverlay" onclick="toggleMobileFilters()"></div>
  <div class="subrow">
    <span id="countLabel"></span>
  </div>
</div>

<div id="globalMetricsBar"></div>
<div id="journeyView">
  <button id="mobileLaneToggleBtn" class="mobile-lane-toggle-btn" onclick="toggleLaneLabels()"><span id="laneToggleIcon">›</span></button>
  <div class="journey-scroll"><div class="journey-grid" id="journeyGrid"></div><div class="gap-strip" id="gapStrip"></div></div>
</div>
<div id="matrixView" style="display:none" class="matrix-wrap">
  <div class="matrix-controls">
    <div class="mc-group"><span class="mc-label">Y axis</span>
      <select class="mc-select" id="yAxisSelect">
        <option value="avg" selected>Value (member + business avg)</option>
        <option value="bv">Business value</option>
        <option value="mv">Member value</option>
        <option value="effort">Effort</option>
      </select>
    </div>
    <div class="mc-group"><span class="mc-label">X axis</span>
      <select class="mc-select" id="xAxisSelect">
        <option value="effort" selected>Effort</option>
        <option value="mv">Member value</option>
        <option value="bv">Business value</option>
        <option value="avg">Value (member + business avg)</option>
      </select>
    </div>
    <div class="mc-group"><span class="mc-label">Circle size</span>
      <select class="mc-select" id="sizeAxisSelect">
        <option value="avg">Value (member + business avg)</option>
        <option value="mv">Member value</option>
        <option value="bv">Business value</option>
        <option value="effort">Effort</option>
        <option value="none">Fixed size</option>
      </select>
    </div>
    <div class="mc-sub-toggle" style="margin-left:auto;display:flex;gap:4px">
      <button class="mc-sub-btn on" id="matrixSubBtn" onclick="setMatrixSubView('matrix')" title="Matrix">
        <svg viewBox="0 0 20 20" width="16" height="16"><circle cx="6" cy="14" r="2.5" fill="currentColor"/><circle cx="14" cy="7" r="3.5" fill="currentColor"/><circle cx="15" cy="16" r="1.5" fill="currentColor"/></svg>
      </button>
      <button class="mc-sub-btn" id="listSubBtn" onclick="setMatrixSubView('list')" title="List">
        <svg viewBox="0 0 20 20" width="16" height="16"><rect x="3" y="4" width="14" height="2.4" fill="currentColor"/><rect x="3" y="9" width="14" height="2.4" fill="currentColor"/><rect x="3" y="14" width="14" height="2.4" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
  <div class="matrix-svg-container" style="position:relative">
    <svg id="matrixSvg" viewBox="0 0 1400 780" style="width:100%;height:calc(100vh - 220px);min-height:500px"></svg>
    <div id="matrixHoverCard" class="matrix-hover-card" style="display:none"></div>
    <div id="matrixListView" style="display:none"></div>
  </div>
</div>

<div id="personaView" style="display:none" class="matrix-wrap">
  <div id="personaGrid" style="display:flex;gap:24px;flex-wrap:wrap;padding:24px"></div>
</div>

<div class="overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-head" id="panelHead">
    <button class="panel-back" id="panelBack" onclick="goBackPanel()">←</button>
    <button class="panel-close" onclick="closePanel()">×</button>
    <div id="panelThumb" style="display:none;position:absolute;top:20px;right:24px;width:110px;height:140px;border-radius:14px;overflow:hidden;border:2px solid var(--line)"></div>
    <div class="panel-badges" id="panelBadges"></div>
    <div class="panel-title" id="panelTitle"></div>
    <div class="panel-sub" id="panelSub"></div>
    <div class="panel-scores" id="panelScores"></div>
    <div class="panel-tabs" id="panelTabsWrap">
      <button class="ptab on" data-tab="overview" onclick="switchTab('overview')">Overview</button>
      <button class="ptab" data-tab="quotes" onclick="switchTab('quotes')">Quotes</button>
      <button class="ptab" data-tab="insights" onclick="switchTab('insights')">Insights</button>
      <button class="ptab" data-tab="opps" onclick="switchTab('opps')">Opportunities</button>
      <button class="ptab" data-tab="solutions" onclick="switchTab('solutions')">Solutions</button>
      <button class="ptab" data-tab="metrics" onclick="switchTab('metrics')">Metrics</button>
      <button class="ptab" data-tab="roadmap" onclick="switchTab('roadmap')">Roadmap</button>
    </div>
  </div>
  <div class="panel-body">
    <div class="pcontent on" id="tab-overview"></div>
    <div class="pcontent" id="tab-quotes"></div>
    <div class="pcontent" id="tab-insights"></div>
    <div class="pcontent" id="tab-opps"></div>
    <div class="pcontent" id="tab-solutions"></div>
    <div class="pcontent" id="tab-metrics"></div>
    <div class="pcontent" id="tab-roadmap"></div>
  </div>
</div>


<script src="assets/js/templates.js"></script>
<script src="assets/js/panel.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
